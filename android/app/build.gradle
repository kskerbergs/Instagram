plugins {
    id "com.android.application"
}

android {
    namespace "lv.calmgram"
    compileSdk 34

    defaultConfig {
        applicationId "lv.calmgram"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // The same filter script the browser extension uses.
    sourceSets {
        main.assets.srcDirs += "../../extension"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
