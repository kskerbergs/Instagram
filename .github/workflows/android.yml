name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - "extension/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Calmgram.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Calmgram.apk \
            --target "$GITHUB_SHA" \
            --title "Calmgram for Android" \
            --notes "Download Calmgram.apk on your phone and open it to install."
