name: Build Wandermap Android app

on:
  push:
    paths:
      - "travel/**"
      - ".github/workflows/wandermap-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (counting rules, share codes)
        run: node --test travel/tests/core.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: travel/android
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Wandermap-apk
          path: travel/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish as the "wandermap-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Wandermap for Android 1.0.${{ github.run_number }}
          NOTES: Wandermap 1.0.${{ github.run_number }}. Download Wandermap.apk on your phone and open it to install; it updates the app already on your phone and keeps your data.
        run: |
          cp travel/android/app/build/outputs/apk/release/app-release.apk Wandermap.apk
          # Update the release in place (never delete it first), so the download link always works,
          # and retry, because GitHub's upload API fails now and then.
          publish() {
            if gh release view wandermap-latest > /dev/null 2>&1; then
              gh release upload wandermap-latest Wandermap.apk --clobber &&
              gh release edit wandermap-latest --title "$TITLE" --notes "$NOTES" --draft=false --latest=false
            else
              gh release create wandermap-latest Wandermap.apk --target "$GITHUB_SHA" \
                --title "$TITLE" --notes "$NOTES" --latest=false
            fi
          }
          for attempt in 1 2 3 4; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
